name: Release Linux binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  DATABASE_URL: sqlite://./ci.db
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,sqlite --locked

      - name: Prepare CI database
        run: |
          cargo sqlx database create
          cargo sqlx migrate run

      - name: Build release binary
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Package binary
        run: |
          tar czf tarang-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-musl/release tarang
          sha256sum tarang-linux-aarch64.tar.gz > tarang-linux-aarch64.tar.gz.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            tarang-linux-aarch64.tar.gz \
            tarang-linux-aarch64.tar.gz.sha256 \
            --title "${{ inputs.tag }}" \
            --generate-notes
